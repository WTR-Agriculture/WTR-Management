version: '3.8'

services:
  # ============================================
  # Frontend (Next.js) - Development
  # ============================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_BASE_URL=http://api:4000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: unless-stopped

  # ============================================
  # Backend API (NestJS) - Development
  # ============================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://wtr:wtr123@db:5432/wtr_dev
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET_PRIVATE=wtr-private
      - STORAGE_BUCKET_PUBLIC=wtr-public
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # ============================================
  # Database (PostgreSQL)
  # ============================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wtr
      POSTGRES_PASSWORD: wtr123
      POSTGRES_DB: wtr_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtr -d wtr_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Object Storage (MinIO - S3-compatible)
  # ============================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================
  # MinIO Client - Create buckets on startup
  # ============================================
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/wtr-private --ignore-existing;
      mc mb myminio/wtr-public --ignore-existing;
      mc anonymous set download myminio/wtr-public;
      echo 'Buckets created successfully';
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: wtr-network
